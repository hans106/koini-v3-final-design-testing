  #phone {

  .spot {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer;
    border-radius: 12px; appearance: none; font-size: 0; color: transparent;
  }
  .spot:active { background: rgba(255, 255, 255, .10); }
  .spot:focus { outline: none; }
  .spot:focus-visible { outline: 2px solid #fff; }
  .backdrop { position: absolute; inset: 0; z-index: 5; }
  .sheet { left: 0; right: 0; bottom: 0; z-index: 6; overflow: hidden; }
  #loader {
    position: absolute; inset: 0; z-index: 10; background: var(--stage-bg); color: var(--loader-text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 15px;
  }
  #bar { width: 60%; height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; }
  #fill { width: 0; height: 100%; background: var(--bar-fill); transition: width .15s; }
  #retry { display: none; padding: 10px 20px; font-size: 15px; border-radius: 10px; border: 1px solid currentColor; background: none; color: inherit; }
  noscript { color: #fff; padding: 24px; text-align: center; }

  switch (o.op) {
    case "add": return a.every(isNum) && a.some(x => typeof x === "number") ? a.reduce((s, x) => s + num(x), 0) : a.map(str).join("");
    case "subtract": return a.slice(1).reduce((s, x) => s - num(x), num(a[0]));
    case "multiply": return a.reduce((s, x) => s * num(x), 1);
    case "divide": return a.slice(1).reduce((s, x) => num(x) === 0 ? 0 : s / num(x), num(a[0]));
    case "equals": return equals(a[0], a[1]);
    case "notEquals": return !equals(a[0], a[1]);
    case "greater": return num(a[0]) > num(a[1]);
    case "greaterOrEqual": return num(a[0]) >= num(a[1]);
    case "less": return num(a[0]) < num(a[1]);
    case "lessOrEqual": return num(a[0]) <= num(a[1]);
    case "and": return a.every(truthy);
    case "or": return a.some(truthy);
    case "not": return !truthy(a[0]);
    default: console.warn("op", o.op); return null;
  }
}
function coerce(id, x) {
  const t = (P.vars[id] || {}).type;
  if (t === "number") return num(x);
  if (t === "boolean") return truthy(x);
  if (t === "string") return str(x);
  return x;
}

/* ---------- actions ---------- */
function exec(actions, ctx) {
  for (const a of actions || []) {
    switch (a.type) {
      case "setVariable":
        vars[a.variable] = coerce(a.variable, a.expr ? ev(a.expr) : a.value);
        break;
      case "conditional":
        for (const blk of a.blocks || []) {
          if (!blk.condition || truthy(ev(blk.condition))) { exec(blk.actions, ctx); break; }
        }
        break;
      case "navigate": ctx.nav = a.dest; break;
      case "back": ctx.back = true; break;
      case "openOverlay": ctx.open = a; break;
      case "closeOverlay": ctx.close = true; break;
    }
  }
}

function run(ix, auto) {
  if (animating) return;
  const ctx = {};
  exec(ix.actions, ctx);
  save();
  const t = { t: (ix.transition || {}).type, dir: (ix.transition || {}).direction, ms: ix.duration_ms || 0 };
  if (ctx.close) closeOverlay(t);
  if (ctx.back) { closeOverlay(null); history.back(); return; }
  if (ctx.nav !== undefined && ctx.nav !== null && String(ctx.nav) !== String(current)) {
    closeOverlay(null);
    if (auto) history.replaceState({ screen: ctx.nav, depth: depth() }, "", "#" + ctx.nav);
    else history.pushState({ screen: ctx.nav, depth: depth() + 1 }, "", "#" + ctx.nav);
    show(ctx.nav, t);
  } else {
    refresh();
  }
  if (ctx.open) openOverlay(ctx.open, t);
}
function depth() { return history.state && history.state.depth || 0; }

/* ---------- rendering ---------- */
function pct(v, total) { return (v / total * 100) + "%"; }
function u(px) { return "calc(var(--u) * " + px + ")"; }
function rgba(c) { return c ? `rgba(${c[0]},${c[1]},${c[2]},${c[3]})` : "inherit"; }
function condOk(c) { return !c || c.every(v => truthy(vars[v])); }

function textEl(l, fw, fh) {
  const st = l.st, [x, y, w, h] = l.b;
  const d = document.createElement("div");
  d.className = "tx";
  d.textContent = str(vars[l.v]);
  const s = d.style;
  s.fontFamily = `"${st.font}", Nunito, sans-serif`;
  s.fontWeight = WEIGHT[(st.style || "").replace(/\s|Italic/g, "")] || 400;
  if (/Italic/.test(st.style || "")) s.fontStyle = "italic";
  s.fontSize = u(st.size);
  s.color = rgba(st.color);
  if (st.opacity !== undefined && st.opacity !== 1) s.opacity = st.opacity;
  const lh = st.lh || { unit: "auto" };
  if (lh.unit === "pixels") s.lineHeight = u(lh.value);
  else if (lh.unit === "percent") s.lineHeight = (lh.value / 100) + "";
  else {
    const lines = Math.max(1, String(st.sample || "").split("\n").length);
    const ratio = AUTO_LH[st.font] || 1.3;
    const single = st.resize === "widthAndHeight" || h < st.size * ratio * 1.5;
    s.lineHeight = single ? u(h / lines) : String(ratio);
  }
  const ls = st.ls || {};
  if (ls.unit === "percent" && ls.value) s.letterSpacing = (ls.value / 100) + "em";
  else if (ls.unit === "pixels" && ls.value) s.letterSpacing = u(ls.value);
  if (st.case === "upper") s.textTransform = "uppercase";
  else if (st.case === "lower") s.textTransform = "lowercase";
  else if (st.case === "title") s.textTransform = "capitalize";
  if (st.deco === "underline") s.textDecoration = "underline";
  else if (st.deco === "strikethrough") s.textDecoration = "line-through";
  s.textAlign = st.align === "justified" ? "justify" : st.align;
  s.top = pct(y, fh);
  if (st.resize === "widthAndHeight") {
    s.whiteSpace = "pre";
    if (st.anchor === "center") { s.left = pct(x + w / 2, fw); s.transform = "translateX(-50%)"; }
    else if (st.anchor === "right") { s.right = pct(fw - x - w, fw); }
    else s.left = pct(x, fw);
  } else {
    s.whiteSpace = "pre-wrap";
    s.overflowWrap = "break-word";
    s.left = pct(x, fw);
    s.width = pct(w, fw);
    if (st.resize === "none" || st.resize === "truncate") {
      s.height = pct(h, fh);
      s.display = "flex"; s.flexDirection = "column";
      s.justifyContent = (st.valign === "center" || st.valign === "middle") ? "center" : st.valign === "bottom" ? "flex-end" : "flex-start";
      const inner = document.createElement("span");
      inner.textContent = d.textContent; d.textContent = ""; d.appendChild(inner);
    }
  }
  return d;
}

function imgEl(file, b, fw, fh) {
  const i = document.createElement("img");
  i.src = "img/" + file;
  i.alt = "";
  i.decoding = "sync";
  i.draggable = false;
  i.style.left = pct(b[0], fw); i.style.top = pct(b[1], fh);
  i.style.width = pct(b[2], fw); i.style.height = pct(b[3], fh);
  return i;
}

function renderDyn(root, id) {
  const f = F[id], fw = f.w, fh = f.h;
  const dyn = root.querySelector(".dyn");
  dyn.textContent = "";
  for (const l of f.L) {
    if (!condOk(l.c)) continue;
    if (l.k === "t") dyn.appendChild(textEl(l, fw, fh));
    else if (l.k === "v") { const file = l.img[str(vars[l.v])]; if (file) dyn.appendChild(imgEl(file, l.b, fw, fh)); }
    else if (l.k === "s") { if (truthy(vars[l.v]) && l.img.true) dyn.appendChild(imgEl(l.img.true, l.b, fw, fh)); }
    else if (l.k === "w") {
      const d = document.createElement("div"), b = l.b, r = l.r || [0, 0, 0, 0];
      d.style.cssText = `position:absolute;left:${pct(b[0], fw)};top:${pct(b[1], fh)};height:${pct(b[3], fh)};` +
        `width:${pct(Math.max(0, num(vars[l.v])), fw)};background:${rgba(l.color)};` +
        `border-radius:${r.map(x => u(x)).join(" ")}`;
      dyn.appendChild(d);
    }
  }
  root.querySelectorAll(".spot").forEach(btn => {
    const sp = f.S[+btn.dataset.i];
    btn.style.display = condOk(sp.c) ? "" : "none";
  });
}

function build(id, cls) {
  const f = F[id];
  const el = document.createElement("div");
  el.className = cls;
  el.dataset.screen = id;
  const img = document.createElement("img");
  img.className = "base"; img.src = "img/" + f.img; img.alt = f.n; img.decoding = "sync"; img.draggable = false;
  const dyn = document.createElement("div"); dyn.className = "dyn";
  const spots = document.createElement("div"); spots.className = "spots";
  f.S.forEach((sp, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "spot"; b.dataset.i = i;
    b.setAttribute("aria-label", sp.label || "Tombol");
    b.style.left = pct(sp.b[0], f.w); b.style.top = pct(sp.b[1], f.h);
    b.style.width = pct(sp.b[2], f.w); b.style.height = pct(sp.b[3], f.h);
    b.addEventListener("click", e => { e.stopPropagation(); for (const ix of sp.ix) run(ix, false); });
    spots.appendChild(b);
  });
  el.append(img, dyn, spots);
  renderDyn(el, id);
  return el;
}

function refresh() {
  if (currentEl) renderDyn(currentEl, current);
  if (overlay) renderDyn(overlay.sheet, overlay.id);
}

function show(id, t) {
  clearTimeout(timer);
  id = String(id);
  const next = build(id, "screen");
  const prev = currentEl;
  current = id; currentEl = next;
  window.__current = id;
  phone.appendChild(next);
  const finish = () => {
    if (prev && prev !== next) prev.remove();
    animating = false;
    const a = F[id].auto;
    if (a) timer = setTimeout(() => { if (current === id) run(a, true); }, a.trigger.ms || 0);
  };
  if (!prev || !t || reduced || !t.ms || t.t === "instant") { finish(); return; }
  animating = true;
  const opts = { duration: t.ms, easing: "ease-out", fill: "both" };
  let anim;
  if (t.t === "push" || t.t === "moveIn" || t.t === "slideIn") {
    const d = t.dir || "left";
    const from = { left: "translateX(100%)", right: "translateX(-100%)", top: "translateY(100%)", bottom: "translateY(100%)" }[d] || "translateX(100%)";
    anim = next.animate([{ transform: from }, { transform: "none" }], opts);
    if (t.t === "push") {
      const to = { left: "translateX(-100%)", right: "translateX(100%)", top: "translateY(-100%)", bottom: "translateY(-100%)" }[d];
      prev.animate([{ transform: "none" }, { transform: to }], opts);
    }
  } else if (t.t === "smartAnimate") {
    prev.animate([{ opacity: 1, offset: 0 }, { opacity: 0, offset: .45 }, { opacity: 0, offset: 1 }], opts);
    anim = next.animate([{ opacity: 0, offset: 0 }, { opacity: 0, offset: .35 }, { opacity: 1, offset: 1 }], opts);
  } else {
    anim = next.animate([{ opacity: 0 }, { opacity: 1 }], opts);
  }
  let ended = false;
  const end = () => { if (ended) return; ended = true; next.getAnimations().forEach(a => a.cancel()); finish(); };
  anim.onfinish = end;
  setTimeout(end, t.ms + 80);
}

function openOverlay(a, t) {
  closeOverlay(null);
  const f = F[String(a.dest)];
  const back = document.createElement("div");
  back.className = "backdrop";
  const c = a.background;
  back.style.background = c ? `rgba(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)},${c.a})` : "transparent";
  if (a.close_on_outside) back.addEventListener("click", () => closeOverlay({ t: "moveOut", ms: 250 }));
  const sheet = build(String(a.dest), "sheet");
  sheet.style.height = pct(f.h, 844);
  if (a.position && !/bottom/i.test(a.position)) { sheet.style.bottom = "auto"; sheet.style.top = /top/i.test(a.position) ? "0" : pct((844 - f.h) / 2, 844); }
  phone.append(back, sheet);
  overlay = { id: String(a.dest), sheet, back };
  if (t && t.ms && !reduced) {
    sheet.animate([{ transform: "translateY(100%)" }, { transform: "none" }], { duration: t.ms, easing: "ease-out" });
    back.animate([{ opacity: 0 }, { opacity: 1 }], { duration: t.ms, easing: "ease-out" });
  }
}
function closeOverlay(t) {
  if (!overlay) return;
  const o = overlay; overlay = null;
  if (t && t.ms && !reduced) {
    o.sheet.animate([{ transform: "none" }, { transform: "translateY(100%)" }], { duration: t.ms, easing: "ease-in", fill: "forwards" });
    o.back.animate([{ opacity: 1 }, { opacity: 0 }], { duration: t.ms, easing: "ease-in", fill: "forwards" });
    setTimeout(() => { o.sheet.remove(); o.back.remove(); }, t.ms + 20);
  } else { o.sheet.remove(); o.back.remove(); }
  refresh();
}

addEventListener("popstate", e => {
  closeOverlay(null);
  const target = e.state ? e.state.screen : P.start;
  show(target, { t: "push", dir: "right", ms: 260 });
});

function sizeUnit() { phone.style.setProperty("--u", (phone.clientWidth / 390) + "px"); }
addEventListener("resize", sizeUnit);

/* ---------- start ---------- */
function preload() {
  const files = new Set();
  for (const f of Object.values(F)) {
    files.add(f.img);
    for (const l of f.L) if (l.img) Object.values(l.img).forEach(x => files.add(x));
  }
  const list = [...files], fill = document.getElementById("fill");
  let done = 0, failed = 0;
  const fonts = Promise.all([
    "800 16px Nunito", "700 16px Nunito", "600 16px Nunito", "400 16px Nunito",
    "800 16px 'Baloo 2'", "700 16px 'Baloo 2'", "600 16px 'Baloo 2'",
  ].map(f => document.fonts.load(f).catch(() => null)));
  const imgs = new Promise((resolve, reject) => {
    list.forEach(src => {
      const i = new Image();
      i.onload = () => { done++; fill.style.width = (done / list.length * 100) + "%"; check(); };
      i.onerror = () => { failed++; check(); };
      i.src = "img/" + src;
    });
    function check() { if (done + failed === list.length) failed ? reject(new Error("gagal")) : resolve(); }
  });
  return Promise.all([imgs, Promise.race([fonts, new Promise(r => setTimeout(r, 4000))])]);
}

function start() {
  sizeUnit();
  const m = location.hash.match(/^#(\d+)$/);
  const saved = history.state && F[history.state.screen] ? history.state : null;
  const restored = (saved || m) ? load() : null;
  vars = Object.assign(defaults(), restored || {});
  save();
  const id = saved ? String(saved.screen) : (m && F[m[1]] ? m[1] : String(P.start));
  if (!saved) history.replaceState({ screen: id, depth: 0 }, "", "#" + id);
  show(id, null);
  document.getElementById("loader").remove();
}

function boot() {
  document.getElementById("retry").style.display = "none";
  document.getElementById("msg").textContent = "Sedang membuka Koini…";
  preload().then(start).catch(() => {
    document.getElementById("msg").textContent = "Gambar gagal dimuat. Cek internetnya, lalu coba lagi.";
    document.getElementById("retry").style.display = "block";
  });
}
document.getElementById("retry").addEventListener("click", boot);
boot();
</script>
</body>
